name: Gerar APK KP Electrical Tools

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK de teste
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK e pasta compactada
        run: |
          mkdir -p output/package
          cp app/build/outputs/apk/debug/app-debug.apk output/KP-Electrical-Tools-v1.2-Sem-Limitacao.apk
          cp output/KP-Electrical-Tools-v1.2-Sem-Limitacao.apk output/package/
          printf 'KP Electrical Tools - Android v1.2\nby NORTECH\nPrecisão elétrica para decisões melhores.\nVersão sem limitação de acessos.\n' > output/package/LEIA-ME.txt
          cd output/package
          zip -r ../KP-Electrical-Tools-v1.2-Sem-Limitacao.zip .

      - name: Disponibilizar APK direto
        uses: actions/upload-artifact@v4
        with:
          name: KP-Electrical-Tools-v1.2-Sem-Limitacao-APK
          path: output/KP-Electrical-Tools-v1.2-Sem-Limitacao.apk
          if-no-files-found: error
          retention-days: 30

      - name: Disponibilizar ZIP compactado
        uses: actions/upload-artifact@v4
        with:
          name: KP-Electrical-Tools-v1.2-Sem-Limitacao-ZIP
          path: output/KP-Electrical-Tools-v1.2-Sem-Limitacao.zip
          if-no-files-found: error
          retention-days: 30
