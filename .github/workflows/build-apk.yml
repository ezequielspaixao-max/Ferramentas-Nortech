name: Gerar APK NORTECH

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK de teste
        run: gradle --no-daemon :app:assembleDebug

      - name: Renomear APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/NORTECH-Ferramentas-v7.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NORTECH-Ferramentas-v7-APK
          path: output/NORTECH-Ferramentas-v7.apk
          if-no-files-found: error
          retention-days: 30
